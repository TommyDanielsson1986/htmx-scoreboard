<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script
    src="https://unpkg.com/htmx.org@1.9.10"
    integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
    crossorigin="anonymous"
  ></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
  <link rel="stylesheet" href="../../css/overlay.css" />
  <title>FGC Overlay</title>
</head>

<body>
  <main class="overlay kof-13" id="overlay-theme">
    <div class="overlay-container">
      <div class="player-left-container" hx-ext="ws" ws-connect="ws://localhost:5000/players-info">
        <div class="player-left-country">
          <img id="flag_p1" class="country" src="../../img/flags/hide.png" alt="flag" />
        </div>
        <div class="player-left-name">
          <div id="p1_name">Player 1</div>
        </div>
        <div class="player-left-score">
          <div id="p1_score">0</div>
        </div>
      </div>

      <div class="rounds-container" hx-ext="ws" ws-connect="ws://localhost:5000/tournament-rounds">
        <div id="round" class="round">FT 2</div>
      </div>

      <div class="player-right-container" hx-ext="ws" ws-connect="ws://localhost:5000/players-info">
        <div class="player-right-score">
          <div id="p2_score">0</div>
        </div>
        <div class="player-right-name">
          <div id="p2_name">Player 2</div>
        </div>
        <div class="player-right-country">
          <img id="flag_p2" class="country" src="../../img/flags/hide.png" alt="flag" />
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const maxLength = 10;       // antal tecken innan skalning
      const defaultFontSize = 2;  // rem, standardstorlek
      const minFontSize = 1.25;   // rem, minsta storlek

      const ids = ["p1_name", "p2_name"];

      function adjustFontSize() {
        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          const textLength = el.textContent.trim().length;

          let fontSize;
          if (textLength <= maxLength) {
            fontSize = defaultFontSize;
          } else {
            fontSize = Math.max(minFontSize, defaultFontSize - 0.1 * (textLength - maxLength));
          }

          el.style.fontSize = fontSize + "rem";
          console.log(`${id} text length: ${textLength}, font-size: ${fontSize}rem`);
        });
      }

      // Kör initialt
      adjustFontSize();

      // Observera hela container för att fånga alla textändringar via HTMX/WS
      const container = document.querySelector(".overlay-container");
      if (container) {
        const observer = new MutationObserver(adjustFontSize);
        observer.observe(container, {
          childList: true,
          subtree: true
        });
      }
    });
  </script>
</body>
</html>
