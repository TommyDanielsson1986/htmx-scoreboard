<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <link rel="stylesheet" href="../../css/overlay-samsho2019.css" />
    <title>FGC overlay</title>
  </head>

  <body>
    <main class="overlay samsho2019" id="overlay-theme">
      <div class="overlay-container" id="overlayContainer">
        <!-- Player 1 -->
        <div id="p1_container" class="player-container player-left">
          <img
            id="p1_flag"
            class="country"
            src="../../img/flags/hide.png"
            hx-trigger="load, every 15s"
            hx-swap="none"
          />
          <div
            id="p1_name"
            class="p1-name"
            hx-trigger="load, every 15s"
            hx-swap="innerHTML"
          >
            Player 1
          </div>
          <div id="p1_score" class="p1-score">0</div>
        </div>

        <!-- ROUNDS (RÖRS ALDRIG) -->
        <div class="rounds-container rounds">
          <div id="round" class="round">FT 2</div>
        </div>

        <!-- Player 2 -->
        <div id="p2_container" class="player-container player-right">
          <div id="p2_score" class="p2-score">0</div>
          <div
            id="p2_name"
            class="p2-name"
            hx-trigger="load, every 15s"
            hx-swap="innerHTML"
          >
            Player 2
          </div>
          <img
            id="p2_flag"
            class="country"
            src="../../img/flags/hide.png"
            hx-trigger="load, every 15s"
            hx-swap="none"
          />
        </div>
      </div>
    </main>

    <script>
      // Hämta query-parametrar från URL
      const params = new URLSearchParams(window.location.search);
      const tourneySlug = params.get("tourneySlug");
      const streamName = params.get("streamName");

      // Sätt dynamiskt hx-get för namn och flaggor
      document
        .getElementById("p1_name")
        .setAttribute(
          "hx-get",
          `/api/player-name?tourneySlug=${tourneySlug}&streamName=${streamName}&slot=0`
        );
      document
        .getElementById("p2_name")
        .setAttribute(
          "hx-get",
          `/api/player-name?tourneySlug=${tourneySlug}&streamName=${streamName}&slot=1`
        );
      document
        .getElementById("p1_flag")
        .setAttribute(
          "hx-get",
          `/api/player-flag-path?tourneySlug=${tourneySlug}&streamName=${streamName}&slot=0`
        );
      document
        .getElementById("p2_flag")
        .setAttribute(
          "hx-get",
          `/api/player-flag-path?tourneySlug=${tourneySlug}&streamName=${streamName}&slot=1`
        );

      // Anpassa namnstorlek
      function adjustNameSize(el) {
        if (!el) return;
        const len = el.textContent.trim().length;
        el.classList.remove("long", "very-long");
        if (len > 12) el.classList.add("very-long");
        else if (len > 8) el.classList.add("long");
      }

      document.addEventListener("DOMContentLoaded", () => {
        adjustNameSize(document.getElementById("p1_name"));
        adjustNameSize(document.getElementById("p2_name"));
      });

      // Uppdatera flaggor när hx-get laddar
      document.body.addEventListener("htmx:afterRequest", (e) => {
        if (e.target.id === "p1_flag" || e.target.id === "p2_flag") {
          e.target.src = e.detail.xhr.responseText;
        }
      });

      // Justera namn efter htmx-swap
      document.body.addEventListener("htmx:afterSwap", (e) => {
        const el = e.detail.elt;
        if (el.id === "p1_name" || el.id === "p2_name") {
          adjustNameSize(el);
        }
      });

      // WebSocket för score + swap + round
      const ws = new WebSocket("ws://localhost:5000/score");
      const p1 = document.getElementById("p1_container");
      const p2 = document.getElementById("p2_container");
      const round = document.getElementById("round");

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (typeof data.p1 === "number")
          document.getElementById("p1_score").textContent = data.p1;
        if (typeof data.p2 === "number")
          document.getElementById("p2_score").textContent = data.p2;
        if (data.round) round.textContent = data.round;

        if (typeof data.swap === "boolean") {
          if (data.swap) {
            p1.classList.replace("player-left", "player-right");
            p2.classList.replace("player-right", "player-left");
          } else {
            p1.classList.replace("player-right", "player-left");
            p2.classList.replace("player-left", "player-right");
          }
        }
      };
    </script>
  </body>
</html>
