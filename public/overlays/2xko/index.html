<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <link rel="stylesheet" href="../../css/overlay-2xko.css" />
    <title>FGC overlay</title>
  </head>

  <body>
    <main class="overlay twoxko" id="overlay-theme">
      <div class="overlay-container" id="overlayContainer">
        <!-- Player 1 -->
        <div id="p1_container" class="player-container player-left">
          <!-- Flagga -->
          <img
            id="p1_flag"
            class="country"
            hx-get="http://localhost:5000/api/player-flag?tourneySlug=demo-for-my-page&streamName=someone&slot=0"
            hx-trigger="load, every 10s"
            hx-swap="outerHTML"
            src="../../img/flags/hide.png"
            alt="flag"
          />
          <!-- Player 1 name -->
          <div
            id="p1_name"
            class="p1-name"
            hx-get="http://localhost:5000/api/player-name?tourneySlug=demo-for-my-page&streamName=someone&slot=0"
            hx-trigger="load, every 10s"
            hx-swap="innerHTML"
          >
            Player 1
          </div>
          <div id="p1_score" class="p1-score">0</div>
        </div>

        <!-- ROUNDS (RÖRS ALDRIG) -->
        <div class="rounds-container rounds">
          <div id="round" class="round">FT 2</div>
        </div>

        <!-- Player 2 -->
        <div id="p2_container" class="player-container player-right">
          <div id="p2_score" class="p2-score">0</div>
          <div
            id="p2_name"
            class="p2-name"
            hx-get="http://localhost:5000/api/player-name?tourneySlug=demo-for-my-page&streamName=someone&slot=1"
            hx-trigger="load, every 10s"
            hx-swap="innerHTML"
          >
            Player 2
          </div>
          <!-- Flagga -->
          <img
            id="p2_flag"
            class="country"
            hx-get="http://localhost:5000/api/player-flag?tourneySlug=demo-for-my-page&streamName=someone&slot=1"
            hx-trigger="load, every 10s"
            hx-swap="outerHTML"
            src="../../img/flags/hide.png"
            alt="flag"
          />
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        adjustNameSize(document.getElementById("p1_name"));
        adjustNameSize(document.getElementById("p2_name"));
      });

      document.body.addEventListener("htmx:afterSwap", (e) => {
        const el = e.detail.elt;
        if (el.id === "p1_name" || el.id === "p2_name") {
          adjustNameSize(el);
        }
      });

      function adjustNameSize(el) {
        if (!el) return;

        const len = el.textContent.trim().length;
        console.log(el.textContent + " - " + len);

        el.classList.remove("long", "very-long");

        if (len > 12) {
          el.classList.add("very-long");
        } else if (len > 8) {
          el.classList.add("long");
        }
      }

      const ws = new WebSocket("ws://localhost:5000/score");

      const p1 = document.getElementById("p1_container");
      const p2 = document.getElementById("p2_container");
      const round = document.getElementById("round");

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        // SCORE
        if (typeof data.p1 === "number") {
          document.getElementById("p1_score").textContent = data.p1;
        }
        if (typeof data.p2 === "number") {
          document.getElementById("p2_score").textContent = data.p2;
        }

        // ROUND
        if (data.round) {
          round.textContent = data.round;
        }

        // SWAP = KLASSBYTE (INTE DOM-MASSAKER)
        if (typeof data.swap === "boolean") {
          if (data.swap) {
            p1.classList.replace("player-left", "player-right");
            p2.classList.replace("player-right", "player-left");
          } else {
            p1.classList.replace("player-right", "player-left");
            p2.classList.replace("player-left", "player-right");
          }
        }
      };
    </script>
  </body>
</html>
