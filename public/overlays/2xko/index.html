<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <link rel="stylesheet" href="../../css/overlay-2xko.css" />
    <title>FGC overlay</title>
  </head>

  <body>
    <main class="overlay twoxko" id="overlay-theme">
      <div class="overlay-container" id="overlayContainer">
        <!-- Player 1 Container -->
        <div id="p1_container" class="player-container">
          <div
            class="player-left-name"
            hx-get="http://localhost:5000/api/player-name?tourneySlug=demo-for-my-page&streamName=someone&slot=0"
            hx-trigger="load, every 10s"
            hx-swap="outerHTML"
          >
            <div id="p1_name">Player 1</div>
          </div>

          <div
            class="player-left-score"
            hx-ext="ws"
            ws-connect="ws://localhost:5000/score"
          >
            <div id="p1_score">0</div>
          </div>

          <div class="player-left-flag">
            <img
              id="flag_p1"
              src="../../img/flags/hide.png"
              alt="flag"
              class="country"
            />
          </div>
        </div>
        <!-- Rounds -->
        <div class="rounds-container">
          <div id="round" class="round">FT 2</div>
        </div>

        <!-- Player 2 Container -->
        <div id="p2_container" class="player-container">
          <div
            class="player-right-name"
            hx-get="http://localhost:5000/api/player-name?tourneySlug=demo-for-my-page&streamName=someone&slot=1"
            hx-trigger="load, every 15s"
            hx-swap="outerHTML"
          >
            <div id="p2_name">Player 2</div>
          </div>

          <div
            class="player-right-score"
            hx-ext="ws"
            hx-swap="outerHTML"
            ws-connect="ws://localhost:5000/score"
          >
            <div id="p2_score">0</div>
          </div>

          <div class="player-right-flag">
            <img
              id="flag_p2"
              src="../../img/flags/hide.png"
              alt="flag"
              class="country"
            />
          </div>
        </div>
      </div>
    </main>

    <script>
      const ws = new WebSocket("ws://localhost:5000/score");

      const overlayContainer = document.getElementById("overlayContainer");
      const p1 = document.getElementById("p1_container");
      const p2 = document.getElementById("p2_container");
      const round = document.getElementById("round");

      // Spara referens: rounds ska alltid ligga i mitten
      const roundsNode = round.parentElement;

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        // Score
        const p1Score = document.getElementById("p1_score");
        const p2Score = document.getElementById("p2_score");
        if (p1Score) p1Score.textContent = data.p1;
        if (p2Score) p2Score.textContent = data.p2;

        // Round
        if (data.round && round) {
          round.textContent = data.round;
        }

        // Swap (VIKTIGT)
        if (data.swap === true) {
          overlayContainer.insertBefore(p2, roundsNode);
          overlayContainer.insertBefore(p1, null);
        }

        if (data.swap === false) {
          overlayContainer.insertBefore(p1, roundsNode);
          overlayContainer.insertBefore(p2, null);
        }
      };
    </script>
  </body>
</html>
