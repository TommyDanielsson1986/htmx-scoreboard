<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <title>Overlay settings</title>
  </head>

  <body>
    <h1>Dashboard Settings</h1>
    <div class="overlay-settings">
      <div hx-ext="ws" ws-connect="/score">
        <form>
          <div class="player-1">
            <label
              >Score
              <div class="buttons">
                <button type="button" onclick="addP1Score()">+</button>
                <input type="text" id="player-one-score" value="0" />
                <button type="button" onclick="removeP1Score()">-</button>
              </div>
            </label>
          </div>

          <div class="player-2">
            <label
              >Score
              <div class="buttons">
                <button type="button" onclick="addP2Score()">+</button>
                <input type="text" id="player-two-score" value="0" />
                <button type="button" onclick="removeP2Score()">-</button>
              </div>
            </label>
          </div>
          <label
            >Round:
            <input type="text" id="round-input" value="FT 2" />
          </label>
          <br />
          <button type="button" onclick="updateScore()">Update Score</button>
          <button type="button" onclick="updateRound()">Update Round</button>
          <br />
          <button type="button" onclick="triggerSwap()">Swap</button>
        </form>
      </div>
    </div>

    <script>
      const ws = new WebSocket("ws://localhost:5000/score");

      function updateRound() {
        const round = document.getElementById("round-input").value;
        ws.send(JSON.stringify({ round }));
      }

      function updateScore() {
        const p1 = Number(document.getElementById("player-one-score").value);
        const p2 = Number(document.getElementById("player-two-score").value);
        ws.send(
          JSON.stringify({ "player-one-score": p1, "player-two-score": p2 })
        );
      }

      function triggerSwap() {
        ws.send(JSON.stringify({ swap: true }));
      }

      function addP1Score() {
        const input = document.getElementById("player-one-score");
        input.value = Number(input.value) + 1;
      }
      function removeP1Score() {
        const input = document.getElementById("player-one-score");
        input.value = Math.max(0, Number(input.value) - 1);
      }
      function addP2Score() {
        const input = document.getElementById("player-two-score");
        input.value = Number(input.value) + 1;
      }
      function removeP2Score() {
        const input = document.getElementById("player-two-score");
        input.value = Math.max(0, Number(input.value) - 1);
      }
    </script>
  </body>
</html>
